<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Casebook</title>
    <meta name="description" content="Casebook: try the live demo or view the code on GitHub." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Newsreader:opsz,wght@6..72,500&display=swap" rel="stylesheet" />
    <style>
      /* The QR code page: two ways in. Colours and fonts are the app's tokens (src/styles/tokens.css). */
      :root {
        --color-canvas: #f4f3ee;
        --color-surface: #ffffff;
        --color-border: #e5e1da;
        --color-border-control: #dad6cd;
        --color-text: #1b1b21;
        --color-text-3: #62656a;
        --color-accent: #1e3fa8;
        --color-accent-hover: #183593;
        --color-on-accent: #ffffff;
        --font-serif: "Newsreader", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
        --font-sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--color-canvas);
        color: var(--color-text);
        font-family: var(--font-sans);
      }
      main {
        width: 100%;
        max-width: 420px;
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: 16px;
        padding: 32px 24px;
      }
      h1 { margin: 0 0 8px; font-family: var(--font-serif); font-weight: 500; font-size: 36px; line-height: 1.1; }
      p { margin: 0 0 24px; color: var(--color-text-3); font-size: 15px; line-height: 1.5; }
      a.btn {
        display: block;
        text-align: center;
        text-decoration: none;
        font-weight: 600;
        font-size: 16px;
        padding: 14px 16px;
        border-radius: 999px;
        margin-top: 12px;
      }
      a.btn--primary { background: var(--color-accent); color: var(--color-on-accent); }
      a.btn--primary:hover { background: var(--color-accent-hover); }
      a.btn--secondary { border: 1px solid var(--color-border-control); color: var(--color-text); }
      a.btn:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
      .tip { margin: 20px 0 0; font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Casebook</h1>
      <p>Judgement training for the AI era. Replay real decisions, bring your own AI-assisted work, and share evidence with your Team Lead.</p>
      <a class="btn btn--primary" href="/">Try the live demo</a>
      <a class="btn btn--secondary" href="https://github.com/POPOL-popo11/casebook">View the code on GitHub</a>
      <p class="tip">In the demo, press "Reset demo data" (sidebar, or the menu on a phone) to start fresh.</p>
    </main>
  </body>
</html>
